<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>e-CV | Luypaerts Romain</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,700">

  <style>
    /* ===== GLOBAL ===== */
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Raleway", sans-serif;
      background-color: black;
      color: white;
    }

    a { text-decoration: none; }

    /* ===== BACKGROUND ===== */
    .bgimg {
      background-image:
        linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)),
        url("https://images.pexels.com/photos/777001/pexels-photo-777001.jpeg");
      min-height: 100%;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ===== NEON TITLE (NO UNDERLINE) ===== */
    .neon {
      color: #baffd9;
      font-size: 3.5em;
      font-weight: 700;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(186, 255, 217, 0.7);
    }

    /* ===== HERO CONTENT (NO CARD EFFECT) ===== */
    .hero-content {
      background-color: transparent;
      backdrop-filter: none;
      border: none;
      padding: 50px;
      max-width: 800px;
      margin: 20px;
      box-shadow: none;
    }

    h3 {
      color: #00FF88;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    /* ===== NAVBAR ===== */
    .w3-bar {
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      padding: 5px 0;
    }

    .w3-bar .w3-button {
      font-weight: 600;
      transition: all 0.3s;
    }

    .w3-bar .w3-button:hover {
      background-color: transparent !important;
      color: #00FF88 !important;
      transform: translateY(-2px);
    }

    /* Highlighting the active page in English */
    .w3-bar .w3-button.w3-green {
      background-color: transparent !important;
      color: #00FF88 !important;
      border-bottom: 2px solid #00FF88;
    }

    /* ===== LANGUAGE MENU ===== */
    .lang-menu {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 9999;
    }

    .lang-globe {
      background-color: rgba(0,0,0,0.6);
      border: 1px solid #00FF88;
      border-radius: 50%;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
      color: #ccffdd;
      transition: all 0.3s;
    }

    .lang-globe:hover {
      background-color: #00FF88;
      color: black;
      transform: scale(1.1);
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #00FF88;
      border-radius: 8px;
      overflow: hidden;
      min-width: 140px;
    }

    .lang-dropdown button {
      background: none;
      border: none;
      color: #ccffdd;
      padding: 12px 15px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .lang-dropdown button:hover {
      background-color: rgba(0, 255, 136, 0.1);
      color: #00FF88;
    }

    /* ===== FOOTER ===== */
    footer {
      background-color: #080808;
      color: #aaa;
      text-align: center;
      padding: 30px 0;
      border-top: 1px solid rgba(0, 255, 136, 0.1);
    }

    footer a { color: #888; transition: 0.3s; margin: 0 10px; }
    footer a:hover { color: #00FF88; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .neon { font-size: 2.2em; }
      .hero-content { padding: 30px 20px; }
    }
  </style>
</head>

<body>

<div class="w3-top">
  <div class="w3-bar w3-card">
    <a href="home.html" class="w3-bar-item w3-button w3-green">Home</a>
    <a href="projects.html" class="w3-bar-item w3-button">Projects</a>
    <a href="tech-watch.html" class="w3-bar-item w3-button">Tech Watch</a>
    <a href="cv-en.html" class="w3-bar-item w3-button">CV</a>
    <a href="skills.html" class="w3-bar-item w3-button">Skills</a>
    <a href="about.html" class="w3-bar-item w3-button">About Me</a>
  </div>
</div>

<div class="lang-menu">
  <button class="lang-globe" onclick="toggleLangMenu()">🌐</button>
  <div class="lang-dropdown" id="langDropdown">
    <button onclick="window.location.href='accueil.html'">Français</button>
    <button onclick="window.location.href='home.html'">English</button>
  </div>
</div>

<header class="bgimg">
  <div class="hero-content">
    <h1 class="neon">Luypaerts Romain</h1>
    <h3>Higher National Diploma in IT</h3>   
  </div>
</header>

<script>
  function toggleLangMenu() {
    const dropdown = document.getElementById("langDropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }

  window.onclick = function(e) {
    const dropdown = document.getElementById("langDropdown");
    if (!e.target.matches('.lang-globe')) {
      dropdown.style.display = "none";
    }
  }
</script>

<footer>
  <p>&copy; 2026 Romain Luypaerts</p>
  <p>
    <a href="privacy-en.html">Privacy Policy</a> /
    <a href="legal-en.html">Legal Mentions</a>
  </p>
</footer>

</body>
</html>
