<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Projects | Luypaerts Romain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,700">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    /* ===== GLOBAL ===== */
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Raleway", sans-serif;
      background-color: black;
      color: white;
      scroll-behavior: smooth;
    }

    a { text-decoration: none; }

    /* ===== BACKGROUND & LAYOUT ===== */
    .bgimg {
      background-image: 
        linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
        url("https://images.pexels.com/photos/777001/pexels-photo-777001.jpeg");
      min-height: 100vh;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      padding: 120px 20px 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== NEON TITLE (MATCHES HOME) ===== */
    .neon {
      color: #baffd9;
      font-size: 3.5em;
      font-weight: 700;
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(186, 255, 217, 0.7);
      text-align: center;
    }

    /* ===== NAVBAR (HARMONIZED) ===== */
    .w3-bar {
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
      padding: 5px 0;
    }

    .w3-bar .w3-button {
      font-weight: 600;
      transition: all 0.3s;
    }

    .w3-bar .w3-button:hover {
      background-color: transparent !important;
      color: #00FF88 !important;
      transform: translateY(-2px);
    }

    .w3-bar .w3-button.w3-green {
      background-color: transparent !important;
      color: #00FF88 !important;
      border-bottom: 2px solid #00FF88;
    }

    /* ===== LANGUAGE MENU (HARMONIZED) ===== */
    .lang-menu {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 9999;
    }

    .lang-globe {
      background-color: rgba(0,0,0,0.6);
      border: 1px solid #00FF88;
      border-radius: 50%;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
      color: #ccffdd;
      transition: all 0.3s;
    }

    .lang-globe:hover {
      background-color: #00FF88;
      color: black;
      transform: scale(1.1);
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      border: 1px solid #00FF88;
      border-radius: 8px;
      overflow: hidden;
      min-width: 140px;
    }

    .lang-dropdown button {
      background: none;
      border: none;
      color: #ccffdd;
      padding: 12px 15px;
      width: 100%;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .lang-dropdown button:hover {
      background-color: rgba(0, 255, 136, 0.1);
      color: #00FF88;
    }

    /* ===== GRID & CARDS ===== */
    .projects-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 35px;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
    }

    .project-card {
      background-color: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 136, 0.1);
      border-left: 5px solid #00FF88;
      padding: 30px;
      border-radius: 12px;
      transition: all 0.4s ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      background-color: rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 25px rgba(0, 255, 136, 0.15);
    }

    .project-card h2 {
      color: white;
      font-size: 1.5em;
      margin: 0;
      text-transform: uppercase;
      font-weight: 700;
    }

    .project-card p {
      color: #ccc;
      line-height: 1.6;
      margin: 20px 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #00FF88;
      color: #00FF88;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.9em;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #00FF88;
      color: black;
    }

    /* ===== FOOTER ===== */
    footer {
      background-color: #080808;
      color: #aaa;
      text-align: center;
      padding: 30px 0;
      border-top: 1px solid rgba(0, 255, 136, 0.1);
    }

    footer a { color: #888; transition: 0.3s; margin: 0 10px; }
    footer a:hover { color: #00FF88; }

    @media (max-width: 700px) {
      .neon { font-size: 2.2em; }
    }
  </style>
</head>

<body>

<div class="w3-top">
  <div class="w3-bar w3-card">
    <a href="home.html" class="w3-bar-item w3-button">Home</a>
    <a href="projects.html" class="w3-bar-item w3-button w3-green">Projects</a>
    <a href="tech-watch.html" class="w3-bar-item w3-button">Tech Watch</a>
    <a href="cv-en.html" class="w3-bar-item w3-button">CV</a>
    <a href="skills.html" class="w3-bar-item w3-button">Skills</a>
    <a href="about.html" class="w3-bar-item w3-button">About Me</a>
  </div>
</div>

<div class="lang-menu">
  <button class="lang-globe" onclick="toggleLangMenu()">🌐</button>
  <div class="lang-dropdown" id="langDropdown">
    <button onclick="window.location.href='projet.html'">Français</button>
    <button onclick="window.location.href='projects.html'">English</button>
  </div>
</div>

<div class="bgimg">
  <h1 class="neon">My Projects</h1>

  <div class="projects-container">
    <!-- PROJECT 1 --> 
    <div class="project-card">
      <div style="display: flex; align-items: center; margin-bottom: 15px;">
        <i class="fas fa-folder-open" style="color: #00FF88; font-size: 1.5em; margin-right: 15px;"></i>
        <h2>Project 1</h2>
      </div>
      <p>Application maintenance and log retrieval on Open Payment systems to optimize transaction monitoring and troubleshooting.</p>
      <a href="Projet_1.pdf" target="_blank" class="btn"><i class="far fa-file-pdf"></i> Open PDF</a>
    </div>
    
    <!-- You can copy-paste the block above for more projects -->
  </div>
</div>

<footer>
  <p>&copy; 2026 Romain Luypaerts</p>
  <p>
    <a href="privacy-en.html">Privacy Policy</a> /
    <a href="legal-en.html">Legal Notice</a>
  </p>
</footer>

<script>
  function toggleLangMenu() {
    const dropdown = document.getElementById("langDropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }

  window.onclick = function(e) {
    const dropdown = document.getElementById("langDropdown");
    if (!e.target.matches('.lang-globe')) {
      dropdown.style.display = "none";
    }
  }
</script>

</body>
</html>
