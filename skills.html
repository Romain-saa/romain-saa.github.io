<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skills | Luypaerts Romain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,700">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: "Raleway", sans-serif;
      background-color: black;
      color: white;
    }
    a { text-decoration: none; }

    .bgimg {
      background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)),
        url("https://images.pexels.com/photos/777001/pexels-photo-777001.jpeg");
      min-height: 100vh;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 20px;
    }

    .neon {
      color: #baffd9;
      font-size: 3.5em;
      font-weight: 700;
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(186, 255, 217, 0.7);
      text-decoration: underline;
      text-underline-offset: 12px;
      text-align: center;
    }

    .w3-bar {
      background-color: rgba(0,0,0,0.9) !important;
      backdrop-filter: blur(8px);
      padding: 5px 0;
    }

    .w3-bar .w3-button {
      font-weight: 600;
      transition: all 0.3s;
      color: white !important;
      background: none !important;
    }

    .w3-bar .nav-active, 
    .w3-bar .nav-active:hover {
      color: #00FF88 !important; 
      border-bottom: 3px solid #00FF88 !important;
      background-color: transparent !important;
    }

    .w3-bar .w3-button:hover:not(.nav-active) {
      color: #00FF88 !important;
      transform: translateY(-2px);
    }

    .hero-content {
      background-color: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 136, 0.08);
      border-left: 5px solid #00FF88;
      padding: 50px;
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
      margin: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .skill { margin-bottom: 25px; transition: transform 0.3s ease; }
    .skill:hover { transform: scale(1.02); }
    .skill span { display: block; margin-bottom: 8px; color: #ccffdd; font-weight: 600; text-transform: uppercase; font-size: 0.9em; }
    .w3-light-grey { background-color: rgba(255, 255, 255, 0.1) !important; height: 14px !important; }
    .progress-bar { background-color: #00FF88 !important; box-shadow: 0 0 10px rgba(0, 255, 136, 0.4); height: 100%; }

    .lang-menu { position: fixed; top: 15px; right: 20px; z-index: 9999; }
    .lang-globe {
      background-color: rgba(0,0,0,0.6);
      border: 1px solid #00FF88;
      border-radius: 50%;
      padding: 10px 14px;
      font-size: 18px;
      cursor: pointer;
      color: #ccffdd;
      transition: all 0.3s;
    }
    .lang-globe:hover { background-color: #00FF88; color: black; transform: scale(1.1); }
    .lang-dropdown {
      display: none; position: absolute; top: 50px; right: 0;
      background-color: rgba(0,0,0,0.9);
      border: 1px solid #00FF88; border-radius: 8px; min-width: 140px;
    }
    .lang-dropdown button {
      background: none; border: none; color: #ccffdd; padding: 12px 15px;
      width: 100%; cursor: pointer; font-weight: 600; transition: 0.2s;
    }
    .lang-dropdown button:hover { background-color: rgba(0, 255, 136, 0.1); color: #00FF88; }

    .zoom-container {
      display: block; margin: 40px auto 20px auto; max-width: 300px;
      border-radius: 10px; overflow: hidden; cursor: pointer; border: 1px solid rgba(0, 255, 136, 0.2);
    }
    .zoom-container img { width: 100%; transition: transform 0.3s ease; }
    .zoom-container:hover img { transform: scale(1.05); }
    .lightbox {
      display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center;
    }
    .img-zoom-lens {
      position: absolute; border: 3px solid #00FF88; width: 180px; height: 180px;
      border-radius: 50%; display: none; pointer-events: none; z-index: 10000;
    }

    footer { background-color: #080808; color: #aaa; text-align: center; padding: 30px 0; border-top: 1px solid rgba(0, 255, 136, 0.1); }
    footer a { color: #888; margin: 0 10px; }
    footer a:hover { color: #00FF88; }

    @media (max-width: 700px) { .neon { font-size: 2.2em; } .hero-content { padding: 30px 20px; } }
  </style>

</head>

<body>

<div class="w3-top">
  <div class="w3-bar w3-card">
    <a href="home.html" class="w3-bar-item w3-button">Home</a>
    <a href="projects.html" class="w3-bar-item w3-button">Projects</a>
    <a href="tech-watch.html" class="w3-bar-item w3-button">Tech Watch</a>
    <a href="cv-en.html" class="w3-bar-item w3-button">CV</a>
    <a href="skills.html" class="w3-bar-item w3-button nav-active">Skills</a>
    <a href="about.html" class="w3-bar-item w3-button">About Me</a>
  </div>
</div>

<div class="lang-menu">
  <button class="lang-globe" onclick="toggleLangMenu()">🌐</button>
  <div class="lang-dropdown" id="langDropdown">
    <button onclick="window.location.href='competences.html'">Français</button>
    <button onclick="window.location.href='skills.html'">English</button>
  </div>
</div>

<div class="bgimg">
  <h1 class="neon">My Skills</h1>

  <div class="hero-content">
    <div class="skill">
      <span>HTML, CSS with VS Code</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:35%"></div></div>
    </div>
    <div class="skill">
      <span>Word, Excel, PowerPoint</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:70%"></div></div>
    </div>
    <div class="skill">
      <span>Windows Configuration</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:50%"></div></div>
    </div>
    <div class="skill">
      <span>Kali Linux, Ubuntu Configuration</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:30%"></div></div>
    </div>
    <div class="skill">
      <span>DHCP, DNS</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:40%"></div></div>
    </div>
    <div class="skill">
      <span>Organization and autonomy</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:85%"></div></div>
    </div>
    <div class="skill">
      <span>Root Me</span>
      <div class="w3-light-grey w3-round"><div class="progress-bar w3-round" style="width:15%"></div></div>
    </div>
  </div>

  <div class="zoom-container">
    <img src="Grille.jpg" alt="Grid" onclick="openLightbox(this.src)">
  </div>
</div>

<div id="lightbox" class="lightbox">
  <span class="w3-button w3-display-topright w3-text-white w3-xxlarge" onclick="closeLightbox()" style="padding:20px; cursor:pointer;">&times;</span>
  <div style="position: relative; display: inline-block; cursor: crosshair;">
    <div id="lens" class="img-zoom-lens"></div>
    <img class="w3-round" id="lightbox-img" style="max-width:90vw; max-height:85vh; border:1px solid #00FF88;">
  </div>
</div>

<footer>
  <p>&copy; 2026 Romain Luypaerts</p>
  <p><a href="privacy-en.html">Privacy Policy</a> / <a href="legal-en.html">Legal Notice</a></p>
</footer>

<script>
  function toggleLangMenu() {
    const dropdown = document.getElementById("langDropdown");
    dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
  }
  function openLightbox(src) {
    const lb = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");
    lb.style.display = "flex";
    img.src = src;
    img.onload = function() { setupZoom("lightbox-img", "lens"); };
  }
  function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
    document.getElementById("lens").style.display = "none";
  }
  function setupZoom(imgID, lensID) {
    let img = document.getElementById(imgID);
    let lens = document.getElementById(lensID);
    const zoom = 3;
    lens.style.backgroundImage = `url('${img.src}')`;
    lens.style.backgroundSize = (img.width * zoom) + "px " + (img.height * zoom) + "px";
    img.parentElement.onmousemove = function(e) {
      lens.style.display = "block";
      let rect = img.getBoundingClientRect();
      let x = e.clientX - rect.left;
      let y = e.clientY - rect.top;
      lens.style.left = (x - (lens.offsetWidth / 2)) + "px";
      lens.style.top = (y - (lens.offsetHeight / 2)) + "px";
      lens.style.backgroundPosition = `-${(x * zoom) - (lens.offsetWidth/2)}px -${(y * zoom) - (lens.offsetHeight/2)}px`;
    };
    img.parentElement.onmouseleave = function() { lens.style.display = "none"; };
  }
  window.onclick = function(e) {
    if (!e.target.matches('.lang-globe')) {
      document.getElementById("langDropdown").style.display = "none";
    }
  }
</script>

</body>
</html>
